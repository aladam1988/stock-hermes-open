<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>美股财报日历</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f5f7;
        --surface: #ffffff;
        --surface-2: #eef3f6;
        --surface-3: #f8fafb;
        --text: #172027;
        --muted: #66737d;
        --line: #d9e0e5;
        --accent: #0f8b8d;
        --accent-dark: #0b6769;
        --orange: #d8572a;
        --green: #16835f;
        --red: #bd3d36;
        --yellow: #a06a00;
        --shadow: 0 16px 38px rgba(31, 43, 52, 0.08);
        --radius: 10px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      [hidden] { display: none !important; }
      body { min-height: 100vh; background: var(--bg); color: var(--text); }

      /* Auth */
      .auth-screen {
        display: flex; align-items: center; justify-content: center; min-height: 100vh;
        padding: 20px;
      }
      .auth-card {
        background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
        padding: 36px; width: 100%; max-width: 380px;
      }
      .auth-card h1 { font-size: 22px; margin: 0 0 6px; }
      .auth-card p { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
      .auth-tabs { display: flex; gap: 4px; margin-bottom: 20px; }
      .auth-tabs button {
        flex: 1; min-height: 38px; border-radius: 7px; background: var(--surface-2);
        color: var(--text); font-size: 14px; font-weight: 700; border: 0; cursor: pointer;
      }
      .auth-tabs button.active { background: var(--text); color: #fff; }
      .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
      .field span { font-size: 13px; font-weight: 700; color: var(--muted); }
      input {
        width: 100%; min-height: 40px; border: 1px solid var(--line); border-radius: 7px;
        background: #fff; color: var(--text); padding: 0 11px; font-size: 15px;
      }
      input:focus { outline: none; border-color: var(--accent); }
      button.submit-btn {
        width: 100%; min-height: 42px; border-radius: 7px; background: var(--text);
        color: #fff; font-size: 15px; font-weight: 700; border: 0; cursor: pointer;
        margin-top: 8px;
      }
      button.submit-btn:hover { background: #263540; }
      .auth-error { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 18px; }

      /* App shell */
      .app-shell { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; }

      /* Header */
      .page-header {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 24px;
      }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-mark {
        width: 38px; height: 38px; border-radius: 9px; background: var(--text);
        color: #fff; font-size: 20px; font-weight: 900; display: flex;
        align-items: center; justify-content: center;
      }
      .brand h1 { font-size: 20px; margin: 0; }
      .brand p { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
      .back-link {
        display: inline-flex; align-items: center; gap: 6px;
        color: var(--muted); text-decoration: none; font-size: 13px;
        padding: 6px 12px; border-radius: 7px; border: 1px solid var(--line);
        background: var(--surface);
      }
      .back-link:hover { color: var(--text); border-color: var(--text); }

      /* Filter controls */
      .controls {
        display: flex; align-items: center; justify-content: space-between;
        flex-wrap: wrap; gap: 10px; margin-bottom: 16px;
      }
      .filter-group { display: flex; gap: 6px; }
      .filter-btn {
        min-height: 34px; padding: 0 14px; border-radius: 999px;
        background: var(--surface-2); color: var(--text); font-size: 13px;
        font-weight: 700; border: 1px solid var(--line); cursor: pointer;
      }
      .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
      .filter-btn.active {
        background: var(--text); color: #fff; border-color: var(--text);
      }
      .meta-line {
        font-size: 12px; color: var(--muted); padding: 8px 12px;
        background: var(--surface-3); border-radius: 7px;
      }

      /* Days accordion */
      .days-list { display: flex; flex-direction: column; gap: 10px; }

      .day-card {
        border: 1px solid var(--line); border-radius: var(--radius);
        background: var(--surface); overflow: hidden;
      }
      .day-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 12px 16px; background: var(--surface-3);
        border-bottom: 1px solid var(--line); cursor: pointer;
        user-select: none;
      }
      .day-header:hover { background: #eef3f6; }
      .day-header-left { display: flex; align-items: center; gap: 10px; }
      .day-badge {
        padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700;
      }
      .day-badge.today { background: var(--accent); color: #fff; }
      .day-badge.past { background: var(--surface-2); color: var(--muted); }
      .day-badge.future { background: #e8f4f4; color: var(--accent-dark); }
      .day-label { font-size: 15px; font-weight: 700; }
      .day-count { font-size: 12px; color: var(--muted); }
      .day-toggle {
        width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line);
        background: var(--surface); display: flex; align-items: center; justify-content: center;
        font-size: 16px; color: var(--muted); transition: transform 0.2s;
      }
      .day-card.collapsed .day-toggle { transform: rotate(-90deg); }
      .day-rows {
        display: flex; flex-direction: column; overflow: visible;
        transition: max-height 0.3s ease, opacity 0.2s;
      }
      .day-card.collapsed .day-rows { max-height: 0; overflow: hidden; opacity: 0; }

      /* Each earnings row */
      .erow {
        display: grid;
        grid-template-rows: auto auto;
        gap: 12px;
        padding: 14px 16px; border-bottom: 1px solid var(--line);
        font-size: 13px; color: inherit;
      }
      .erow:hover { background: #f8fafb; }
      .erow:last-child { border-bottom: 0; }
      .erow-main {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto;
        gap: 14px; align-items: center;
      }
      .erow-actions {
        display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end;
      }
      .erow-action {
        border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
        color: var(--text); padding: 7px 11px; font-size: 12px; font-weight: 800;
        cursor: pointer; text-decoration: none; white-space: nowrap;
      }
      .erow-action.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .erow-action:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(27, 31, 35, 0.08); }

      .erow-ticker strong { display: block; font-size: 15px; color: var(--text); }
      .erow-ticker span {
        display: block; font-size: 12px; color: var(--muted); margin-top: 3px;
        max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .company-zh {
        display: inline-flex; margin-top: 6px; padding: 3px 8px; border-radius: 999px;
        background: #e8f4f4; color: var(--accent-dark); font-size: 11px; font-weight: 800;
      }
      .company-category {
        display: inline-flex; margin-top: 6px; margin-left: 6px; padding: 3px 8px; border-radius: 999px;
        background: var(--surface-2); color: var(--muted); font-size: 11px; font-weight: 800;
      }
      .company-desc {
        margin-top: 7px; max-width: 520px; color: var(--muted); font-size: 12px; line-height: 1.45;
      }
      .erow-info {
        display: grid;
        grid-template-columns: minmax(300px, 1.4fr) minmax(180px, 0.7fr);
        gap: 12px; align-items: stretch;
      }
      .erow-details {
        display: grid; grid-template-columns: repeat(4, minmax(110px, 1fr)); gap: 8px;
      }
      .detail-pill {
        border: 1px solid var(--line); border-radius: 10px; background: #fbfcfd;
        padding: 8px 10px; min-height: 48px;
      }
      .detail-pill span { display: block; color: var(--muted); font-size: 11px; margin-bottom: 4px; }
      .detail-pill strong { display: block; color: var(--text); font-size: 13px; }

      .erow-meta { display: flex; flex-direction: column; gap: 7px; align-items: flex-end; }
      .time-chip {
        display: inline-flex; border-radius: 999px; padding: 4px 10px;
        font-size: 11px; font-weight: 700; white-space: nowrap;
      }
      .time-chip.pre { background: #fff8e1; color: #835400; }
      .time-chip.post { background: #f3e5ff; color: #6a3a8c; }
      .time-chip.unspecified { background: var(--surface-2); color: var(--muted); }
      .marketcap { font-size: 11px; color: var(--muted); white-space: nowrap; }

      .eps-surprise {
        font-size: 12px; font-weight: 800;
      }
      .eps-surprise.beat { color: var(--green); }
      .eps-surprise.miss { color: var(--red); }
      .eps-surprise.in-line { color: var(--yellow); }

      /* Loading / empty */
      .state-card {
        border: 1px solid var(--line); border-radius: var(--radius);
        background: var(--surface); padding: 48px 24px; text-align: center;
      }
      .state-card h3 { font-size: 16px; margin: 0 0 8px; }
      .state-card p { color: var(--muted); font-size: 13px; margin: 0; }
      .spinner {
        width: 36px; height: 36px; border: 3px solid var(--line); border-top-color: var(--accent);
        border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Toast */
      .toast {
        position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
        background: var(--text); color: #fff; padding: 10px 20px; border-radius: 999px;
        font-size: 13px; font-weight: 700; opacity: 0; transition: opacity 0.2s;
        pointer-events: none; z-index: 9999;
      }
      .toast.show { opacity: 1; }

      /* Responsive */
      @media (max-width: 760px) {
        .erow-main, .erow-info { grid-template-columns: 1fr; }
        .erow-actions, .erow-meta { justify-content: flex-start; align-items: flex-start; }
        .erow-details { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .page-header { flex-direction: column; align-items: flex-start; gap: 12px; }
      }
    </style>
  </head>
  <body>

    <!-- Auth screen -->
    <div id="auth-screen" class="auth-screen">
      <div class="auth-card">
        <h1>美股财报日历</h1>
        <p>登录后查看近期美股财报公布日期</p>
        <div class="auth-tabs">
          <button id="login-tab" class="active" type="button">登录</button>
          <button id="register-tab" type="button">注册</button>
        </div>
        <form id="auth-form">
          <div class="field">
            <span>用户名</span>
            <input id="auth-username" type="text" autocomplete="username" placeholder="例如 a1234" />
          </div>
          <div class="field">
            <span>密码</span>
            <input id="auth-password" type="password" autocomplete="current-password" placeholder="至少 6 位" />
          </div>
          <button id="auth-submit" class="submit-btn" type="submit">登录</button>
          <p id="auth-error" class="auth-error"></p>
        </form>
      </div>
    </div>

    <!-- Main app -->
    <div id="app-shell" class="app-shell" hidden>

      <header class="page-header">
        <div class="brand">
          <div class="brand-mark">H</div>
          <div>
            <h1>美股财报日历</h1>
            <p>Nasdaq Earnings Calendar · 延迟数据</p>
          </div>
        </div>
        <a class="back-link" href="./index.html">← 返回研究台</a>
      </header>

      <div class="controls">
        <div class="filter-group">
          <button id="btn-past" class="filter-btn active" type="button">过去 7 天</button>
          <button id="btn-future" class="filter-btn" type="button">未来 7 天</button>
          <button id="btn-all" class="filter-btn" type="button">全部 14 天</button>
        </div>
        <button id="btn-refresh" class="filter-btn" type="button">🔄 刷新</button>
      </div>

      <div id="meta-line" class="meta-line" hidden></div>

      <div id="loading-state" class="state-card">
        <div class="spinner"></div>
        <h3>正在加载财报日历</h3>
        <p>从 Nasdaq 获取数据，请稍候…</p>
      </div>

      <div id="error-state" class="state-card" hidden>
        <h3>加载失败</h3>
        <p id="error-msg">请检查网络后重试</p>
      </div>

      <div id="days-list" class="days-list"></div>

    </div>

    <div id="toast" class="toast"></div>

    <script>
      const authScreen = document.getElementById('auth-screen');
      const appShell = document.getElementById('app-shell');
      const authForm = document.getElementById('auth-form');
      const authUsername = document.getElementById('auth-username');
      const authPassword = document.getElementById('auth-password');
      const authSubmit = document.getElementById('auth-submit');
      const authError = document.getElementById('auth-error');
      const loginTab = document.getElementById('login-tab');
      const registerTab = document.getElementById('register-tab');

      const btnPast = document.getElementById('btn-past');
      const btnFuture = document.getElementById('btn-future');
      const btnAll = document.getElementById('btn-all');
      const btnRefresh = document.getElementById('btn-refresh');

      const metaLine = document.getElementById('meta-line');
      const loadingState = document.getElementById('loading-state');
      const errorState = document.getElementById('error-state');
      const errorMsg = document.getElementById('error-msg');
      const daysList = document.getElementById('days-list');
      const toastEl = document.getElementById('toast');

      let currentUser = null;
      let earningsWindow = null;
      let filter = 'past'; // 'past' | 'future' | 'all'
      let loading = false;
      let refreshing = false;
      const EARNINGS_CACHE_KEY = 'stockHermesEarningsWindow.v1';
      const EARNINGS_CACHE_TTL = 5 * 60 * 1000;

      // ---- Auth ----
      let authMode = 'login';

      function setAuthMode(mode) {
        authMode = mode;
        loginTab.classList.toggle('active', mode === 'login');
        registerTab.classList.toggle('active', mode === 'register');
        authSubmit.textContent = mode === 'login' ? '登录' : '注册并登录';
        authPassword.autocomplete = mode === 'login' ? 'current-password' : 'new-password';
        authError.textContent = '';
      }

      loginTab.addEventListener('click', () => setAuthMode('login'));
      registerTab.addEventListener('click', () => setAuthMode('register'));

      authForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = authUsername.value.trim();
        const password = authPassword.value;
        authError.textContent = '';
        authSubmit.disabled = true;
        try {
          const endpoint = authMode === 'login' ? '/api/auth/login' : '/api/auth/register';
          const resp = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
          });
          const data = await resp.json().catch(() => ({}));
          if (!resp.ok || !data.ok) throw new Error(data.error || `HTTP ${resp.status}`);
          authPassword.value = '';
          setAuthenticated(data.user);
          showToast(authMode === 'login' ? '登录成功' : '注册成功');
        } catch (err) {
          authError.textContent = err.message || String(err);
        } finally {
          authSubmit.disabled = false;
        }
      });

      async function initAuth() {
        try {
          const resp = await fetch('/api/auth/me');
          const data = await resp.json();
          if (data.ok && data.user) { setAuthenticated(data.user); return; }
        } catch {}
        setUnauthenticated();
      }

      function setAuthenticated(user) {
        currentUser = user;
        authScreen.hidden = true;
        appShell.hidden = false;
        loadCachedEarnings();
        loadEarnings({ background: Boolean(earningsWindow) });
      }

      function setUnauthenticated() {
        currentUser = null;
        authScreen.hidden = false;
        appShell.hidden = true;
        setAuthMode('login');
      }

      // ---- Filter buttons ----
      daysList.addEventListener('click', async (event) => {
        const secButton = event.target.closest('[data-action="sec"]');
        if (secButton) {
          await openLatestFiling(secButton.dataset.symbol || '', secButton.dataset.fallbackUrl || '');
          return;
        }
        const analyzeButton = event.target.closest('[data-action="analyze"]');
        if (analyzeButton) {
          goAnalyzeEarnings(analyzeButton.dataset.symbol || '', analyzeButton.dataset.name || '');
        }
      });

      [btnPast, btnFuture, btnAll].forEach(btn => {
        btn.addEventListener('click', () => {
          filter = btn === btnPast ? 'past' : btn === btnFuture ? 'future' : 'all';
          updateFilterButtons();
          renderEarnings();
        });
      });

      btnRefresh.addEventListener('click', () => loadEarnings({ force: true }));

      function updateFilterButtons() {
        btnPast.classList.toggle('active', filter === 'past');
        btnFuture.classList.toggle('active', filter === 'future');
        btnAll.classList.toggle('active', filter === 'all');
      }

      function filterLabel() {
        if (filter === 'past') return '过去 7 天';
        if (filter === 'future') return '未来 7 天';
        return '全部 14 天';
      }

      function filteredRows() {
        if (!earningsWindow) return [];
        const anchor = new Date(earningsWindow.anchorDate || Date.now());
        const rows = earningsWindow.rows || [];
        if (filter === 'all') return rows;
        return rows.filter(row => {
          const d = new Date(row.date);
          return filter === 'future' ? d >= anchor : d < anchor;
        });
      }

      // ---- Render ----
      function showState(state) {
        loadingState.hidden = state !== 'loading';
        errorState.hidden = state !== 'error';
        daysList.hidden = state !== 'ok';
        metaLine.hidden = state !== 'ok';
      }

      function renderEarnings() {
        if (loading) { showState('loading'); return; }
        if (!earningsWindow || !earningsWindow.ok) { showState('error'); return; }

        const rows = filteredRows();
        const total = earningsWindow.total;
        const source = earningsWindow.source || 'Nasdaq';

        const cacheHint = refreshing ? ' · 后台更新中…' : (earningsWindow.cached ? ' · 已用本地缓存秒开' : '');
        metaLine.textContent = `数据来源：${source} · ${filterLabel()} · 共 ${rows.length} 家 · ${earningsWindow.startDate} 至 ${earningsWindow.endDate}${cacheHint}`;
        showState('ok');

        if (!rows.length) {
          daysList.innerHTML = `<div class="state-card"><h3>无财报</h3><p>该区间内暂无财报公布</p></div>`;
          return;
        }

        // Group by date
        const byDate = {};
        rows.forEach(row => {
          if (!byDate[row.date]) byDate[row.date] = [];
          byDate[row.date].push(row);
        });

        daysList.innerHTML = '';
        Object.keys(byDate).sort().forEach(date => {
          const dayRows = byDate[date];
          const dateObj = new Date(date);
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          const isToday = dateObj.getTime() === today.getTime();
          const isPast = dateObj < today;

          let badgeClass, badgeText;
          if (isToday) { badgeClass = 'today'; badgeText = '今天'; }
          else if (isPast) { badgeClass = 'past'; badgeText = '过去'; }
          else { badgeClass = 'future'; badgeText = '未来'; }

          const dayLabel = isToday ? '今天' : dateObj.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'short' });

          const card = document.createElement('div');
          card.className = 'day-card';
          card.innerHTML = `
            <div class="day-header" data-date="${date}">
              <div class="day-header-left">
                <span class="day-badge ${badgeClass}">${badgeText}</span>
                <span class="day-label">${dayLabel}</span>
                <span class="day-count">${dayRows.length} 家</span>
              </div>
              <span class="day-toggle">▾</span>
            </div>
            <div class="day-rows">
              ${dayRows.map(row => renderErow(row)).join('')}
            </div>
          `;

          const header = card.querySelector('.day-header');
          header.addEventListener('click', () => card.classList.toggle('collapsed'));

          daysList.appendChild(card);
        });
      }

      function renderErow(row) {
        const timeMap = { '盘前': 'pre', '盘后': 'post' };
        const timeClass = timeMap[row.timeLabel] || 'unspecified';
        const symbol = encodeURIComponent(row.symbol || '');
        const filingUrl = `https://www.sec.gov/edgar/search/#/q=${symbol}&category=custom&forms=6-K%252C20-F%252C10-Q%252C10-K%252C8-K`;
        const surprise = computeSurprise(row.eps, row.epsForecast);
        const surpriseHtml = surprise === null
          ? '<strong>待公布</strong>'
          : `<strong class="eps-surprise ${surprise > 0 ? 'beat' : surprise < 0 ? 'miss' : 'in-line'}">${surprise > 0 ? '+' : ''}${surprise.toFixed(1)}%</strong>`;
        const eventLabel = row.eps ? '已披露' : '待披露';
        const nameZh = row.nameZh ? `<span class="company-zh">${escapeHtml(row.nameZh)}</span>` : '';
        const category = row.category ? `<span class="company-category">${escapeHtml(row.category)}</span>` : '';
        const description = row.description ? `<p class="company-desc">${escapeHtml(row.description)}</p>` : '';

        return `
          <div class="erow" data-symbol="${row.symbol}">
            <div class="erow-main">
              <div class="erow-ticker">
                <strong>${escapeHtml(row.symbol)}</strong>
                <span>${escapeHtml(row.name || '公司名称待补充')}</span>
                <div>${nameZh}${category}</div>
                ${description}
              </div>
              <div class="erow-actions">
                <button class="erow-action primary" type="button" data-action="analyze" data-symbol="${row.symbol}" data-name="${escapeAttr(row.name || '')}">财报分析</button>
                <button class="erow-action" type="button" data-action="sec" data-symbol="${row.symbol}" data-fallback-url="${filingUrl}">打开最新 SEC 披露</button>
              </div>
            </div>
            <div class="erow-info">
              <div class="erow-details">
                <div class="detail-pill"><span>预期 EPS</span><strong>${row.epsForecast || '暂无'}</strong></div>
                <div class="detail-pill"><span>实际 EPS</span><strong>${row.eps || (row.timeLabel === '未注明' ? '待确认' : '待公布')}</strong></div>
                <div class="detail-pill"><span>超预期幅度</span>${surpriseHtml}</div>
                <div class="detail-pill"><span>财季截止</span><strong>${row.fiscalQuarterEnding || '暂无'}</strong></div>
              </div>
              <div class="erow-meta">
                <span class="time-chip ${timeClass}">${eventLabel} · ${row.timeLabel}</span>
                ${row.marketCap ? `<span class="marketcap">市值 ${row.marketCap}</span>` : '<span class="marketcap">市值暂无</span>'}
                <span class="marketcap">${row.source || 'Nasdaq earnings calendar'}</span>
              </div>
            </div>
          </div>
        `;
      }

      function computeSurprise(actual, forecast) {
        const av = parseEps(actual);
        const fv = parseEps(forecast);
        if (av === null || fv === null || fv === 0) return null;
        return ((av - fv) / Math.abs(fv)) * 100;
      }

      function parseEps(value) {
        if (value == null) return null;
        const text = String(value).trim();
        if (!text || text === '-' || text === '--' || text === '暂无') return null;
        const normalized = text.replace(/[$,]/g, '').replace(/^\((.*)\)$/, '-$1');
        const n = parseFloat(normalized);
        return Number.isFinite(n) ? n : null;
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function escapeAttr(value) {
        return String(value).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function goAnalyzeEarnings(symbol, name) {
        if (!symbol) return;
        const question = `${symbol} ${name ? `（${name}）` : ''} 最近要发财报，请结合财报日历、预期 EPS、财季、市值、真实行情和最新 SEC/公司披露，分析这家公司本次财报最应该关注什么、可能的超预期/低预期点、估值风险和接下来需要验证的问题。不要给买卖建议，只做观察池研究。`;
        window.location.href = `./index.html?ask=${encodeURIComponent(question)}&ticker=${encodeURIComponent(symbol)}`;
      }

      async function openLatestFiling(symbol, fallbackUrl) {
        try {
          const resp = await fetch(`/api/filing/latest?symbol=${encodeURIComponent(symbol)}`);
          const data = await resp.json().catch(() => ({}));
          const targetUrl = data.ok && data.url ? data.url : (data.fallbackUrl || fallbackUrl);
          window.open(targetUrl, '_blank', 'noopener,noreferrer');
        } catch (error) {
          window.open(fallbackUrl, '_blank', 'noopener,noreferrer');
        }
      }

      // ---- Load ----
      function loadCachedEarnings() {
        try {
          const cached = JSON.parse(sessionStorage.getItem(EARNINGS_CACHE_KEY) || 'null');
          if (!cached || !cached.payload || Date.now() - cached.savedAt > EARNINGS_CACHE_TTL) return false;
          earningsWindow = { ...cached.payload, cached: true };
          loading = false;
          renderEarnings();
          return true;
        } catch {
          sessionStorage.removeItem(EARNINGS_CACHE_KEY);
          return false;
        }
      }

      function saveCachedEarnings(payload) {
        try {
          sessionStorage.setItem(EARNINGS_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), payload }));
        } catch {
          // ignore storage limits/private mode
        }
      }

      async function loadEarnings(options = {}) {
        if (!currentUser) return;
        const { background = false, force = false } = options;
        if (loading || refreshing) return;
        const cachedOk = !force && !background && loadCachedEarnings();
        if (cachedOk) {
          loadEarnings({ background: true });
          return;
        }

        loading = !background;
        refreshing = background;
        renderEarnings();
        try {
          const cacheBust = force ? `&refresh=${Date.now()}` : '';
          const resp = await fetch(`/api/earnings?daysBack=7&daysForward=7${cacheBust}`);
          const data = await resp.json().catch(() => ({}));
          if (!resp.ok || !data.ok) throw new Error(data.error || `HTTP ${resp.status}`);
          earningsWindow = { ...data, cached: false };
          saveCachedEarnings(data);
        } catch (err) {
          if (!earningsWindow) {
            earningsWindow = null;
            errorMsg.textContent = err.message || '请检查网络后重试';
          } else {
            showToast('后台更新失败，继续显示已缓存日历');
          }
        } finally {
          loading = false;
          refreshing = false;
          renderEarnings();
        }
      }

      // ---- Toast ----
      let toastTimer = null;
      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
      }

      // ---- Boot ----
      initAuth();
    </script>
  </body>
</html>
